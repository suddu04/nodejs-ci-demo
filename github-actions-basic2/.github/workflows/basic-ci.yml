name: Basic CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  basic-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Show Files
        run: ls -la

      - name: Read Application File
        run: cat app.txt

      - name: Print Success Message
        run: echo "CI Pipeline Completed Successfully  "
